# XcodeGen manifest for GoldenNuggetMobile.xcodeproj — the source of truth for
# the project.  XcodeGen is installed (2.46) and
#
#     xcodegen generate
#
# writes project.pbxproj from this file, so that file is a build product and
# must not be edited by hand.
#
# Package.swift is, separately, the source of truth for the *source list*:
# `- path: Nugget` below is deliberately the same source root Package.swift
# declares.  XcodeGen cannot know that list — it does not read Package.swift —
# so generation ends by running `scripts/sync-pbxproj-sources.py` (see
# `postGenCommand` below), which asks SwiftPM what the target resolves and
# rewrites the Sources phase to match.  `xcodegen generate` followed by that
# script is idempotent: running the pair twice writes an identical file, and
# `scripts/sync-pbxproj-sources.py --check` passes on the result.
#
# XcodeGen 2.46 quirks this file works around — re-check after an upgrade:
#
#   * its `createIntermediateGroups` default would nest the Icon Composer
#     document inside a second, same-named "Assets.xcassets" group beside the
#     catalog it lives in, and the two objects then carry random `TEMP_…` IDs —
#     which makes every regeneration churn.  The document's source entry pins
#     `createIntermediateGroups: false` so it is emitted as an ordinary sibling
#     file reference instead.
#   * it types the document `wrapper.icon` where the hand-written project used
#     `folder.iconcomposer.icon`.  actool accepts `wrapper.icon` — the Xcode
#     build routes it to AssetCatalogCompiler, `.icon` and catalog alike are
#     passed as inputs, and scripts/check-car-appearances.py still finds the
#     dark renditions — so it is left as XcodeGen produces it.
#   * the target settings the project needs but XcodeGen does not infer
#     (`LD_RUNPATH_SEARCH_PATHS`, `ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS`)
#     are stated explicitly in the target's `settings.base` below.
#
# Everything below is chosen to make an Xcode build produce the *same bundle*
# `xtool dev build` produces, because the two are shipped from the same sources
# and a difference between them is a bug that only shows up on device:
#
#   * EMProxy is a **dynamic** xcframework slice (`@rpath/EMProxy.framework`),
#     so it has to be copied into `Frameworks/` and re-signed — which is what
#     `LD_RUNPATH_SEARCH_PATHS = @executable_path/Frameworks` (target settings)
#     points at.  **Xcode does the copy itself**: the slice is a `.binaryTarget`
#     of the vendored `Minimuxer` package, and a dynamic package binary is
#     embedded by SwiftPM's `SwiftPackageCopyFilesTaskProducer`.  Do NOT add it
#     here as an `embed: true` dependency: that is what used to put a hand-written
#     "Embed Frameworks" phase in project.pbxproj, and the two producers then emit
#     the same copy command twice — which Xcode 27.1 reports as
#     `error: Unexpected duplicate tasks` and refuses to build (the build manifest
#     shows two identical `TRIGGER: Copy …/Frameworks/EMProxy.framework` edges on
#     the framework's CodeSign task).  The manifest also names the surviving
#     producer: `…-SwiftPackageCopyFilesTaskProducer / com.apple.compilers.pbxcp
#     Copy …/GoldenNuggetMobile.app/Frameworks/…`.
#   * Signing is **Automatic with the personal team** (see the settings below), so
#     ⌘R installs on a device.  Ad hoc (`CODE_SIGN_IDENTITY = "-"`, the shape
#     xtool's signer produces) stopped being accepted for device builds in
#     Xcode 27.1 — `Ad Hoc code signing is not allowed with SDK 'iOS 27.1'` — and
#     "no signing at all" is what ⌘R then reports as `The executable is not
#     codesigned`.  The shipping path is unaffected: scripts/build-ipa.sh builds
#     the *unsigned* IPA on purpose (CODE_SIGNING_ALLOWED=NO on the command line),
#     because a sideloader signs it and entitlements.plist asks for
#     `com.apple.security.iokit-user-client-class`, which a personal team's
#     profile cannot grant.  ⌘R with that entitlement in place may therefore still
#     be refused at signing; handle that by dropping the key for local runs, not
#     by going back to an unsigned project.
#   * The icon is an asset catalog holding an Icon Composer document, and
#     `ASSETCATALOG_COMPILER_APPICON_NAME` / `..._STANDALONE_ICON_BEHAVIOR`
#     below describe the pair of settings that make it compile into a car with
#     the dark half intact.  No loose PNGs are bundled: they are light-only and
#     would shadow it.
name: GoldenNuggetMobile
options:
  bundleIdPrefix: com.awesomenull
  createIntermediateGroups: true
  groupSortPosition: top
  # Generation is two steps in one: XcodeGen writes project.pbxproj, then the
  # reconciler rewrites the Sources phase to what SwiftPM resolves (see the note
  # at the top of this file).  XcodeGen runs this with the spec's directory as
  # the working directory, so the relative path is what it expects.  The scripts
  # in this repo are not marked executable, hence the explicit `python3`.
  postGenCommand: python3 scripts/sync-pbxproj-sources.py

packages:
  Minimuxer:
    path: Vendor

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # No App Intents or Shortcuts are declared; skip their metadata build task.
    LM_SKIP_METADATA_EXTRACTION: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: layout/Applications/GoldenNuggetMobile.app/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: lol.wow.mobile
    PRODUCT_NAME: GoldenNuggetMobile
    CODE_SIGN_ENTITLEMENTS: entitlements.plist
    # Automatic signing with the personal team Xcode is already signed in with —
    # the same pair the other device projects on this machine carry
    # (`IDEProvisioningTeamManagerLastSelectedTeamID` is this team).  Needed for
    # ⌘R: an unsigned build installs nowhere, and Xcode reports it as
    # `IDEInstallCoreDeviceWorker / LaunchExecutableValidationErrorDomain: The
    # executable is not codesigned`.
    #
    # `CODE_SIGNING_ALLOWED = NO` used to sit here and made that setting a lie:
    # it is not in the Signing & Capabilities pane, so the UI shows Automatic
    # signing while nothing gets signed.  The *shipped* artifact is still
    # unsigned, because scripts/build-ipa.sh passes the same NO on the command
    # line (a command-line setting beats this file) and the sideloader signs.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: L7HX85L6GU
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 9.7.0
    # The app icon is a single-size `AppIcon.appiconset` carrying the three
    # renditions the system picks between — light, dark, and the grayscale one
    # iOS tints.  The icon is flat artwork (a white W on lavender), so a plain
    # appiconset states exactly what ships; the Icon Composer document that used
    # to be here layered a glass render over a gradient and had no way to carry
    # this mark without re-deriving its materials.
    #
    # `ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS` (below, on the target)
    # still compiles the `ScrappedIcon` alternate alongside it.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The global tint — the lavender the app's controls use — is a color asset
    # rather than a `.tint()` on the root view, so UIKit's own chrome (alerts,
    # the text cursor, the share sheet's buttons) agrees with SwiftUI's.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # `--standalone-icon-behavior none`.  Belt and braces, and stated here rather
    # than in the pbxproj because it is the intent: no loose icon PNGs beside
    # Assets.car — a loose light-only PNG in the bundle root wins over the
    # catalog's rendition and would throw away the dark and tinted halves.  It
    # is also why scripts/build-ipa.sh deletes them from the Payload before it
    # zips.
    ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: none
  configs:
    # The one deliberate divergence from the xtool bundle, for size: xtool links
    # the symbol table in (6.0 MB strtab + 1.3 MB nlist — 47% of a 15.7 MB
    # binary, and 1.1 MB more in the embedded EMProxy), and it cannot strip
    # afterwards because it signs the product it just built.  An Xcode build
    # signs nothing here at all (CODE_SIGNING_ALLOWED = NO above, and
    # scripts/build-ipa.sh passes the same on the command line), so Release can
    # strip at the copy phase and the IPA gets ~8.5 MB smaller for free.  Debug
    # keeps its symbols.
    Release:
      COPY_PHASE_STRIP: YES

targets:
  GoldenNuggetMobile:
    type: application
    platform: iOS
    sources:
      - path: Nugget
      # The catalog, compiled by actool into Assets.car: the app icon (all three
      # appearances), the alternate `ScrappedIcon`, and the global `AccentColor`.
      # actool finds all three from the catalog alone — `--app-icon AppIcon`
      # names the primary, and an `.appiconset` needs no second input the way an
      # Icon Composer `.icon` document did.
      - path: layout/Applications/GoldenNuggetMobile.app/Assets.xcassets
        buildPhase: resources
      # The in-app logo `NativeLogo` draws (home header, first run, About).  The
      # Xcode build has to ship the same loose `Logo@1x/@2x` files xtool.yml
      # copies, or `NativeLogo` finds no bundle image and falls back to its
      # placeholder box on every screen that shows it.
      - path: layout/Applications/GoldenNuggetMobile.app/Logo@2x.png
        buildPhase: resources
      - path: layout/Applications/GoldenNuggetMobile.app/Logo@1x.png
        buildPhase: resources
      # NO loose AppIcon*.png here, on purpose.  actool can emit them itself
      # (`standalone-icon-behavior`, set to `none` below) and a loose light-only
      # PNG in the bundle root wins over the catalog's rendition — which would
      # throw away the dark half of the icon this catalog exists to carry.  The
      # PNGs stay in layout/ because xtool.yml's iconPath points at them; that
      # build does not read this file.
    dependencies:
      - package: Minimuxer
        product: Minimuxer
      # The app unpacks `.tendies` wallpaper packs itself, and a `.tendies` is a
      # ZIP. Same package, second product: SwiftPM does not expose a transitive
      # dependency, so `import ZIPFoundation` needs this line as well as the one
      # in Package.swift. `sync-pbxproj-sources.py` reconciles the source list,
      # not the package products, so this file and project.pbxproj have to agree
      # by hand — hence the comment.
      - package: Minimuxer
        product: ZIPFoundation
      # The AirTraffic sandbox escape, same package, third product. `import
      # AirliftFFI` needs this line as well as the one in Package.swift, for the
      # same reason ZIPFoundation does. Deliberately NOT embedded by hand the
      # way EMProxy is: that slice is a static .a, so there is no framework to
      # copy into Frameworks/ and nothing to re-sign.
      - package: Minimuxer
        product: AirliftFFI
      - sdk: libsqlite3.tbd
      # NeoSpring resprings by loading a payload into a WKWebView
      # (Nugget/Core/NeoSpring.swift), so WebKit has to be linked. It is a
      # system framework, so it is linked, not embedded.
      - sdk: WebKit.framework
      # EMProxy is deliberately NOT listed here.  It reaches the app through the
      # `Minimuxer` package (`.binaryTarget(name: "EMProxy", …)` in
      # Vendor/Package.swift) and SwiftPM embeds the dynamic slice itself; listing
      # it again produced a second, identical copy command — see the note at the
      # top of this file.
    settings:
      base:
        OTHER_LDFLAGS:
          - "-framework"
          - "UIKit"
        # The hand-written pbxproj carried these on the target; project.yml used
        # to omit them, so a regeneration would have dropped them.  The rpath is
        # what lets the embedded EMProxy dynamic slice load; the icon-catalog
        # setting is what compiles the alternate `ScrappedIcon` alongside the
        # primary stack.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  GoldenNuggetMobile:
    build:
      targets:
        GoldenNuggetMobile: all
    run:
      config: Debug
